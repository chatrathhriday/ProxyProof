# Render's free tier sleeps after 15 min idle and the next request takes ~50 s.
# Pinging /health every 10 minutes keeps it warm, so the app and dashboard open instantly.
# (GitHub may delay scheduled runs by a few minutes; that's fine for this purpose.)
name: Keep server awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 --retry 2 https://proxyproof.onrender.com/health
