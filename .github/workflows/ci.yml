# Backend tests (incl. the simulated 10-minute class) and the dashboard build, on every push.
name: Tests

on:
  push:
    branches: [main]
    paths: ['backend/**', 'dashboard/**', '.github/workflows/ci.yml']
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            dashboard/package-lock.json
      - name: Backend tests
        working-directory: backend
        run: npm ci && npm test
      - name: Dashboard build + lint
        working-directory: dashboard
        run: npm ci && npm run build && npx oxlint src
