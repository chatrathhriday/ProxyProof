# Builds the release APK on GitHub's servers (the dev laptop runs out of memory for AOT builds).
# - push to main touching app/ -> APK attached to the workflow run (Actions tab -> run -> Artifacts)
# - push a tag like v1.0.0      -> APK also published as a GitHub Release asset
name: Android APK

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/apk.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # needed to create the Release on tags

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.3'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Restore the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "PROXYPROOF_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 secret missing, signing with a throwaway debug key"
          fi

      - name: Build release APK (points at the deployed server)
        env:
          PROXYPROOF_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: flutter build apk --release --dart-define=API_URL=https://proxyproof.onrender.com

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk ProxyProof.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ProxyProof-apk
          path: app/ProxyProof.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/ProxyProof.apk
          generate_release_notes: true
